[package]
name = "ig-viewer"
version = "0.1.0"
description = "Offline viewer for Instagram DM exports"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ig_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled: compiles SQLite from vendored source, so no system libsqlite3 and no
# network at build time. load_extension is deliberately NOT enabled anywhere.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
# Only for O_NOFOLLOW when opening validated media; no other libc use.
libc = "0.2"
# System IANA timezone detection (reads /etc/localtime, no network).
iana-time-zone = "0.1"
# IANA rules bundled at compile time: no network, no runtime tzdata dependency.
chrono-tz = "0.10"
# Extracts a user-supplied Instagram .zip export. Defused by construction: every
# member path is validated against the destination root before anything is written,
# so a zip-slip entry cannot escape.
zip = { version = "2", default-features = false, features = ["deflate"] }

# rfd covers the desktop pickers (macOS/Windows/*nix). Android is a separate native
# app under android-app/, so this crate no longer carries any mobile target cfg.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
