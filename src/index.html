<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IG Chat Archive Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside id="side">
      <header>
        <div class="titlerow">
          <b id="title">IG Chat Archive Viewer</b>
          <button id="settings-btn" class="icon" type="button" title="Settings" aria-label="Settings">&#9881;</button>
        </div>
        <div class="row">
          <button id="pick" type="button">Open folder&hellip;</button>
          <button id="pickzip" type="button">Open .zip&hellip;</button>
          <button id="picksd" type="button">Import pushed file</button>
          <button id="delete" type="button" hidden>Delete index</button>
        </div>
        <input id="root" type="text" placeholder="Export folder path, or a .zip path" />
        <button id="index" type="button">Import</button>
        <input id="filter" type="search" placeholder="Filter chats…" disabled />
        <small id="status">Starting&hellip;</small>
        <small id="tz"></small>
      </header>
      <div id="fallback" class="warn" hidden></div>
      <div id="list"></div>
    </aside>

    <main id="main">
      <div id="toolbar" hidden>
        <select id="me" title="Which participant are you?"></select>
        <button id="first" type="button">Start</button>
        <button id="prev" type="button">&#9664;</button>
        <select id="months"></select>
        <button id="next" type="button">&#9654;</button>
        <button id="last" type="button">Latest</button>
        <input id="date" type="date" title="Jump to date" />
        <input id="q" type="search" placeholder="Search all chats…" />
        <span class="sp"></span>
        <button id="tzset" class="icon" type="button" title="Timezone is set in Settings">TZ</button>
      </div>
      <div id="results" hidden></div>
      <div id="msgs">
        <div class="dim">
          Choose your unzipped Instagram export folder to begin. Everything stays on this
          computer: the app makes no network requests.
        </div>
      </div>
    </main>

    <div id="lightbox" hidden><img id="lightbox-img" alt="" /></div>

    <div id="settings" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header>
          <b id="settings-title">Settings</b>
          <button id="settings-close" class="icon" type="button" aria-label="Close settings">&#10005;</button>
        </header>
        <div class="opt">
          <label for="set-theme">Theme</label>
          <select id="set-theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">Follow system</option>
          </select>
        </div>
        <div class="opt">
          <label for="set-fs">Text size</label>
          <input id="set-fs" type="range" min="13" max="20" step="1" />
          <output id="set-fs-out"></output>
        </div>
        <div class="opt">
          <label for="set-density">Row density</label>
          <select id="set-density">
            <option value="cozy">Cozy</option>
            <option value="compact">Compact</option>
          </select>
        </div>
        <div class="opt">
          <label for="set-motion">Animations</label>
          <input id="set-motion" type="checkbox" />
        </div>
        <div class="opt">
          <label for="set-tz">Default timezone</label>
          <input id="set-tz" type="text" placeholder="Europe/Warsaw" size="18" />
        </div>
        <footer class="dim">
          Settings are stored locally in this app. No network, no accounts, no telemetry.
        </footer>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
